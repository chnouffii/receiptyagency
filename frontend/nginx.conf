server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── En-têtes de sécurité ────────────────────────────────────────────────
    # Le middleware du backend ne couvre QUE les réponses de l'API : sans ces
    # lignes, le HTML servi ici (dont /admin et /client) part sans protection.
    # `always` = envoyé aussi sur les réponses d'erreur (401, 404, 5xx).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # CSP — `unsafe-inline`/`unsafe-eval` sont requis en l'état : CRA injecte un
    # script inline dans index.html et les pages redessinées utilisent des
    # styles inline (style={{…}}). À resserrer une fois ces deux points traités.
    # connect-src/script-src autorisent PostHog ; img-src couvre les visuels
    # Unsplash des études de cas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.posthog.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Les source maps ne doivent jamais être servies (cf. GENERATE_SOURCEMAP=false).
    # Filet de sécurité si une image ancienne en contient encore.
    location ~ \.map$ {
        return 404;
    }

    # Compression des réponses texte (perf)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/xml text/xml image/svg+xml;

    # Assets hashés générés par le build (CRA /static/*) : cache long et immuable.
    # Sûr car chaque déploiement change le hash du fichier.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx n'hérite PAS des add_header du bloc `server` dès qu'un `location`
        # définit les siens : sans cette répétition, les assets repartiraient
        # sans aucun en-tête de sécurité.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # SPA + pages pré-rendues : nginx sert build/<route>/index.html s'il existe
    # (généré par le prérendu), sinon retombe sur l'index SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
